name: SDK verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: SDK checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['26.8.2', '20']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up release tooling
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Select and verify npm
        run: |
          npm install --global npm@11.19.1
          test "$(node --version)" = "v26.8.2"
          test "$(npm --version)" = "11.19.1"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check formatting
        run: npm run format:check
      - name: Test release rules and PR metadata
        run: npm run test:release
      - name: Build a clean package
        run: npm run build
      # Install tooling only on Node 26; consumers must still work on Node 20.
      - name: Select consumer runtime
        if: matrix.node == '20'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Test SDK and enforce all four 91% coverage thresholds
        run: npm run test:coverage
      - name: Verify the packed SDK in an external consumer
        run: npm run verify:package
